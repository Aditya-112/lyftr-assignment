services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      PORT: "8000"
      LLM_API_KEYS: ${LLM_API_KEYS:?Set LLM_API_KEYS in .env}
      LLM_MODEL: ${LLM_MODEL:-gemini/gemini-3.1-flash-lite}
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/app.db}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      ENABLE_FAILURE_SIMULATION: ${ENABLE_FAILURE_SIMULATION:-false}
      DEFAULT_SYSTEM_PROMPT: ${DEFAULT_SYSTEM_PROMPT-You are a helpful, concise assistant.}
      LLM_REQUEST_TIMEOUT: ${LLM_REQUEST_TIMEOUT:-25}
      CACHE_TTL: ${CACHE_TTL:-3600}
      LITELLM_LOCAL_MODEL_COST_MAP: ${LITELLM_LOCAL_MODEL_COST_MAP:-True}
      LITELLM_LOG: ${LITELLM_LOG:-CRITICAL}
    volumes:
      - chat_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=3).close()"]
      interval: 10s
      timeout: 4s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "3000:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  chat_data:
